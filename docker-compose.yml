services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rag-service:
    build: ./services/rag-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
      # Optional: set OPENAI_API_KEY in a .env file (see .env.example) to get
      # LLM-generated answers from /answer instead of the extractive fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db
    volumes:
      - ./services/rag-service/app:/app/app
      - ./scripts:/app/scripts
      - ./docs:/app/docs

  core-service:
    build: ./services/core-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/documind
      SPRING_DATASOURCE_USERNAME: documind
      SPRING_DATASOURCE_PASSWORD: documind
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-key-please-32-bytes-min}
    depends_on:
      - db

volumes:
  pgdata:
